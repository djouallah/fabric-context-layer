name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  # Fail in seconds rather than after the build: the tag names the release, but the wheel is
  # named from pyproject's version, and PyPI rejects a mismatch at the very last step.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the pyproject version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $v"; exit 1
          fi

  tests:
    needs: version-check
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # trusted publishing; no API token is stored anywhere
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
